[package]
name = "ao-escrow"
version = "0.1.0"
description = "Agent Overflow Crypto Escrow — on-chain bounty verification"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "ao_escrow"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "0.30.1"
anchor-spl = "0.30.1"
# groth16-solana: BN254 pairing verifier via Solana native alt_bn128 syscalls.
# This is what sp1-solana uses internally — using it directly avoids the
# proc-macro2 toolchain conflict that sp1-solana's heavy dep tree causes.
groth16-solana = "0.2.0"
sha2 = "0.10"
