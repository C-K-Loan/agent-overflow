[package]
name = "mpro-vina-prover"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "mpro-vina-prover"
path = "src/main.rs"

[dependencies]
sp1-sdk = { version = "6.1.0", features = ["blocking"] }
sp1-solana = { git = "https://github.com/succinctlabs/sp1-solana" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
anyhow = "1"
